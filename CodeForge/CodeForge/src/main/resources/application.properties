spring.config.import=optional:file:.env[.properties]
spring.application.name=CodeForge
server.port=${SERVER_PORT:8080}
codeforge.projects-base=${CODEFORGE_PROJECTS_BASE:./projects}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/${DB_NAME:codeforge}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USER:codeforge}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
codeforge.jwt.secret=${JWT_SECRET:}
codeforge.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
